name: Build and test modpack

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and structure tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Resolve mods, verify hashes, and build Modrinth pack
        run: python build.py
      - name: Forge dedicated-server smoke test
        run: python tests/smoke_server.py
      - name: Upload build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locked-reality-build
          path: |
            build/locked-reality-0.1.0.mrpack
            build/resolved-mods.json
            build/server-smoke.log
          if-no-files-found: warn
          retention-days: 14
