name: Build and test modpack

concurrency:
  group: locked-reality-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and structure tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Resolve mods, verify hashes, and build Modrinth pack
        run: python build.py
      - name: Create source project ZIP
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path(".")
          include = ["README.md", ".gitignore", "pack", "config", "kubejs", "quests", "tests", "docs", ".github", "build.py"]
          with ZipFile("build/locked-reality-project.zip", "w", ZIP_DEFLATED) as z:
              for entry in include:
                  p = root / entry
                  if p.is_file():
                      z.write(p, p.as_posix())
                  elif p.is_dir():
                      for f in p.rglob("*"):
                          if f.is_file() and ".git" not in f.parts and "__pycache__" not in f.parts and f.suffix != ".pyc":
                              z.write(f, f.as_posix())
          PY
      - name: Upload project and modpack
        uses: actions/upload-artifact@v4
        with:
          name: locked-reality-project
          path: |
            build/locked-reality-0.1.0.mrpack
            build/locked-reality-project.zip
            build/resolved-mods.json
          if-no-files-found: error
          retention-days: 14
      - name: Forge dedicated-server smoke test
        run: python tests/smoke_server.py
      - name: Upload server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locked-reality-server-test
          path: build/server-smoke.log
          if-no-files-found: warn
          retention-days: 14
